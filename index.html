<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click the Button!</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 100px;
    background-color: #f0f0f0;
  }
  button {
    padding: 20px 40px;
    font-size: 24px;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    background-color: #4CAF50;
    color: white;
    transition: transform 0.2s;
  }
  button:hover {
    transform: scale(1.1);
  }
</style>
</head>
<body>

<h1>Press the Button for a Surprise!</h1>
<button id="mysteryButton">Click Me!</button>

<script>
document.getElementById('mysteryButton').addEventListener('click', function() {
    window.location.href = "https://youtu.be/QDia3e12czc?si=kRVEx1PsfiWI692-"; // your new link
});
</script>

</body>
</html>
